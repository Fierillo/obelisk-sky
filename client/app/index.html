<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Obelisk Sky</title>
  <meta name="description" content="A 3D village of Obelisk channels. Log in with your Nostr key, walk to a channel's house and talk there, join calls, play games, drink mate on the plaza." />
  <meta name="theme-color" content="#cfeaff" />
  <link rel="canonical" href="https://sky.obelisk.ar/app" />
  <!-- Link previews (Open Graph, X/Twitter, Telegram, Signal, Discord…). The card is scripts/make-og.mjs. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Obelisk Sky" />
  <meta property="og:title" content="Obelisk Sky: walk into Nostr conversations" />
  <meta property="og:description" content="A 3D village of Obelisk channels. Log in with your Nostr key, walk to a channel's house and talk there, join calls, play games, drink mate on the plaza." />
  <meta property="og:url" content="https://sky.obelisk.ar/app" />
  <meta property="og:image" content="https://sky.obelisk.ar/og.jpg?v=5" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A floating low-poly village around a green obelisk: houses, a river, a running track and people chatting." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Obelisk Sky: walk into Nostr conversations" />
  <meta name="twitter:description" content="A 3D village of Obelisk channels: chat, calls, games and mate on the plaza." />
  <meta name="twitter:image" content="https://sky.obelisk.ar/og.jpg?v=5" />
  <meta name="twitter:image:alt" content="A floating low-poly village around a green obelisk." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/brand/sky-mark-flat.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app" class="booting">
    <canvas id="scene"></canvas>
    <div id="overlay"></div>

    <header class="top">
      <a class="brand" href="/" title="About Obelisk Sky">
        <img src="/brand/sky-mark.svg" class="brand-mark" alt="" />
        <span>Obelisk <b>Sky</b></span>
      </a>
      <button id="relay-btn" class="relay-btn" data-state="connecting" title="Switch relay" aria-label="Switch relay" aria-haspopup="dialog">
        <span class="relay-ico">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M12 7.5v4M12 11.5 6.5 16M12 11.5l5.5 4.5"/></svg>
          <span class="relay-dot"></span>
        </span>
        <span class="relay-txt"><small>Relay</small><span id="relay-name">public.obelisk.ar</span></span>
        <svg class="relay-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button id="status" class="status" data-mode="connecting" title="Switch between Live and History" aria-label="Live or History: tap to switch">
        <span class="dot"></span><span class="status-text" data-i18n="status.connecting">Connecting…</span>
        <svg class="status-swap" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
      </button>
      <div class="hud-tabs">
        <button id="tab-channels" class="hud-tab" title="Channels on this relay">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>
          <span id="tab-channels-n">0</span><span class="hud-tab-label">Channels</span>
        </button>
        <button id="tab-members" class="hud-tab" title="Members: who's online, away and offline">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5"/></svg>
          <span class="hud-online"></span><span id="tab-members-n">0</span><span class="hud-tab-label">Online</span>
        </button>
      </div>
      <div class="bell-wrap">
        <button id="bell" class="bell" hidden aria-label="Mentions and replies" title="Mentions and replies">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span id="bell-count" class="bell-count" hidden></span>
        </button>
        <div id="bell-panel" class="bell-panel" hidden>
          <div class="bell-head"><span>Mentions and replies</span><button id="bell-read" class="bell-read">Mark all read</button></div>
          <div id="bell-list" class="bell-list"></div>
        </div>
      </div>
      <button id="menu-btn" class="menu-btn" title="Menu" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
      <button id="login" class="account-btn primary" data-i18n="login">Log in</button>
      <div id="account" class="account" hidden>
        <button id="account-look" class="account-look" title="Your look">
          <span id="account-avatar" class="account-avatar"></span>
          <span class="account-who"><span id="account-name" class="account-name"></span><span id="account-nip" class="account-nip"></span></span>
        </button>
        <button id="logout" class="account-btn danger" title="Log out" data-i18n="logout">Log out</button>
      </div>
    </header>

    <aside id="feed" class="feed" aria-live="polite"></aside>

    <aside id="card" class="card" hidden>
      <div class="card-head">
        <span class="card-grip" aria-hidden="true"></span>
        <button class="card-close" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="card-body"></div>
    </aside>

    <footer class="bottom">
      <div class="timeline-panel" id="timeline-panel" hidden>
        <div class="tl-head">
          <div class="tl-spans" id="tl-spans" role="group" aria-label="How far back"></div>
          <div class="tl-peaks" id="tl-peaks" aria-label="Busiest moments"></div>
        </div>
        <div class="timeline" id="timeline" title="Drag across a stretch to replay it, or click a moment">
          <canvas id="timeline-canvas"></canvas>
          <div class="timeline-sel" id="timeline-sel" hidden></div>
          <div class="timeline-cursor" id="timeline-cursor"></div>
          <div class="timeline-labels"><span id="tl-start"></span><span>now</span></div>
        </div>
      </div>
      <nav class="controls" aria-label="View controls">
        <button data-act="director" class="on" title="Auto-director: follow conversations" data-i18n-title="ctl.director.title">
          <svg viewBox="0 0 24 24"><path d="M4 7h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><path d="m16 11 6-3v8l-6-3"/></svg><span class="ctl-label" data-i18n="ctl.director">Auto camera</span>
        </button>
        <button data-act="story" title="History: replay the latest conversation (again to go live)" data-i18n-title="ctl.story.title">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg><span class="ctl-label" data-i18n="ctl.story">History</span>
        </button>
        <button data-act="time" title="Time of day: Buenos Aires" data-i18n-title="ctl.time.title">
          <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="ctl-label" data-i18n="ctl.time">Time of day</span>
        </button>
        <button data-act="signs" class="on" title="Channel signs" data-i18n-title="ctl.signs.title">
          <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M5 6h12l2 2.5L17 11H5Z"/><path d="M19 13H7l-2 2.5L7 18h12Z"/></svg><span class="ctl-label" data-i18n="ctl.signs">Signs</span>
        </button>
        <button data-act="tilt" class="on" title="Toy-town view: blur the top and bottom of the picture so the island looks like a tiny model" aria-label="Toy-town view" data-i18n-title="ctl.tilt.title">
          <svg viewBox="0 0 24 24"><path d="M6.5 17.5v-6L12 7l5.5 4.5v6Z"/><path d="M10.5 17.5v-3.2h3v3.2"/><path d="M2.5 3h19M2.5 21h19" stroke-dasharray="1.2 2.4" opacity=".5"/></svg><span class="ctl-label" data-i18n="ctl.tilt">Toy town</span>
        </button>
        <button data-act="sound" title="Ambient sound" data-i18n-title="ctl.sound.title">
          <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path class="mute" d="m17 9 5 6M22 9l-5 6"/><path class="wave" d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12" style="display:none"/></svg><span class="ctl-label" data-i18n="ctl.sound">Sound</span>
        </button>
        <button data-act="districts" title="Districts (relay operator)" hidden data-i18n-title="ctl.districts.title">
          <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10l4-3 4 3v11"/><path d="M13 21v-7l3-2 3 2v7"/><path d="M8 13h2M8 16h2"/></svg><span class="ctl-label" data-i18n="ctl.districts">Districts</span>
        </button>
        <button data-act="home" title="Whole island" data-i18n-title="ctl.home.title">
          <svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4Z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span class="ctl-label" data-i18n="ctl.home">Whole island</span>
        </button>
        <button data-act="emote" title="Emotes: dance, lotus pose… (G)" aria-label="Emotes" data-i18n-title="ctl.emote.title">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.3 2 3.5 2 3.5-2 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/></svg><span class="ctl-label" data-i18n="ctl.emote">Emotes</span>
        </button>
        <button data-act="firstperson" title="First-person view (V)" aria-label="First-person view" data-i18n-title="ctl.firstperson.title">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span class="ctl-label" data-i18n="ctl.firstperson">First person</span>
        </button>
        <button data-act="settings" title="Settings" aria-label="Settings" data-i18n-title="ctl.settings.title">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="ctl-label" data-i18n="ctl.settings">Settings</span>
        </button>
        <button data-act="help" title="How to play (controls)" aria-label="How to play" data-i18n-title="ctl.help.title">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg><span class="ctl-label" data-i18n="ctl.help">Controls</span>
        </button>
        <button data-act="fullscreen" title="Fullscreen" data-i18n-title="ctl.fullscreen.title">
          <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span class="ctl-label" data-i18n="ctl.fullscreen">Fullscreen</span>
        </button>
        <button data-act="about" class="ctl-menu-only" title="About Obelisk Sky" data-i18n-title="ctl.about.title">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg><span class="ctl-label" data-i18n="ctl.about">About</span>
        </button>
        <button data-act="logout" class="ctl-menu-only danger" title="Log out" hidden data-i18n-title="ctl.logout.title">
          <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg><span class="ctl-label" data-i18n="ctl.logout">Log out</span>
        </button>
      </nav>
    </footer>

    <div id="gate" class="gate" hidden>
      <div class="gate-card">
        <img src="/brand/sky-mark.svg" class="gate-mark" alt="" />
        <div class="gate-title">Obelisk Sky</div>
        <div class="gate-text"></div>
        <button id="gate-login" class="account-btn primary big" data-i18n="gate.login">Log in with Nostr</button>
      </div>
    </div>

    <div id="loading" class="loading" data-stage="0">
      <div class="loading-clouds" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="loading-inner" role="status">
        <img src="/brand/sky-mark.svg" class="loading-mark" alt="" />
        <div class="loading-title" data-i18n="loading.island">Raising the island…</div>
        <div class="loading-bar"><div id="loading-fill"></div></div>
      </div>
    </div>
    <!-- The prompts, stacked bottom-up: the voice call, then chat, seat, someone near. -->
    <div id="dock" class="dock">
      <div id="callbar" class="callbar" hidden>
        <div class="callbar-info"><span class="callbar-dot"></span><span id="call-title"></span><span id="call-who" class="callbar-who"></span></div>
        <button id="call-join" class="account-btn primary">Join call</button>
        <button id="call-stay" class="account-btn" hidden title="Stay in the call wherever you walk">Stay</button>
        <button id="call-mic" class="account-btn call-toggle" hidden title="Microphone" aria-label="Microphone" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg><span class="call-toggle-label">Mic</span></button>
        <button id="call-cam" class="account-btn call-toggle" hidden title="Camera" aria-label="Camera" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3"/><path class="slash" d="M4 4l16 16"/></svg><span class="call-toggle-label">Camera</span></button>
        <button id="call-leave" class="account-btn danger" hidden>Leave</button>
        <a id="call-app" class="account-btn" target="_blank" rel="noopener" hidden>Open in Obelisk</a>
      </div>
      <button id="seat-hint" class="seat-hint" hidden></button>
      <button id="chat-hint" class="seat-hint chat-hint" hidden></button>
      <div id="near-hint" class="near-hint" hidden>
        <span id="near-name" class="near-name"></span>
        <button id="near-dm" class="account-btn" title="Private message (M)">💬 Message</button>
        <button id="near-call" class="account-btn" title="Private voice call">📞 Call</button>
      </div>
    </div>
    <div id="theater" class="theater-panel" role="region" aria-label="Theater" hidden></div>
    <div id="pcall" class="callbar pcall" hidden>
      <div class="callbar-info"><span class="callbar-dot"></span><span id="pcall-title"></span><span id="pcall-sub" class="callbar-who"></span></div>
      <button id="pcall-accept" class="account-btn primary" hidden>Accept</button>
      <button id="pcall-mic" class="account-btn" hidden>Mute</button>
      <button id="pcall-end" class="account-btn danger">Hang up</button>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="rotate" class="rotate" role="dialog" aria-modal="true" aria-labelledby="rotate-title">
      <div class="rotate-phone" aria-hidden="true"><img src="/brand/sky-mark.svg" alt="" /></div>
      <div id="rotate-title" class="rotate-title" data-i18n="rotate.title">Turn your phone sideways</div>
      <div class="rotate-text" data-i18n="rotate.text">The village is played in landscape.</div>
      <button type="button" class="account-btn primary big" data-i18n="rotate.button">Go full screen</button>
    </div>
    <div id="wipe" class="wipe"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
